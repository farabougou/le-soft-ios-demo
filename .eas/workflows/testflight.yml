name: Le Soft - Tests et TestFlight
on:
  push:
    branches: ['main']
jobs:
  build_ios:
    name: Verifier et construire iOS
    type: build
    params:
      platform: ios
      profile: production
    hooks:
      after_install_node_modules:
        - name: TypeScript
          run: npm run typecheck
        - name: Lint
          run: npm run lint
        - name: Regressions
          run: npm test
  submit_ios:
    name: Envoyer vers TestFlight
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
